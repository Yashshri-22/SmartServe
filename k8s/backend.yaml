apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartserve-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartserve-backend
  template:
    metadata:
      labels:
        app: smartserve-backend
    spec:
      containers:
        - name: backend
          image: trushitasathe/smartserve-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: smartserve-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP