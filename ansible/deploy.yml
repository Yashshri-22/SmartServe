---
- name: Deploy SmartServe with Docker
  hosts: web
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create SmartServe deployment directory
      ansible.builtin.file:
        path: /opt/smartserve
        state: directory
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: /opt/smartserve/docker-compose.yml
        mode: "0644"

    - name: Copy backend application
      ansible.builtin.copy:
        src: ../backend/
        dest: /opt/smartserve/backend/

    - name: Copy frontend application
      ansible.builtin.copy:
        src: ../frontend/
        dest: /opt/smartserve/frontend/

    - name: Protect backend environment file
      ansible.builtin.file:
        path: /opt/smartserve/backend/.env
        mode: "0600"

    - name: Build and start SmartServe containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/smartserve
